<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Txapita – Gestão de Microcrédito</title>
<meta name="theme-color" content="#0d2a6e">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Txapita">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f6f5f2;--tx:#111b3a;--mu:#6b7490;--nv:#0d2a6e;--go:#f5b800;--ok:#16825d;--wa:#a96c00;--er:#c93b3b;--in:#2f5fd0;--soft:#eceef5;--ln:#e8e6df;--sh:0 1px 2px rgba(17,27,58,.04),0 6px 18px rgba(17,27,58,.06);color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 'DM Sans',system-ui,sans-serif;padding-bottom:calc(78px + env(safe-area-inset-bottom,0px))}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;background:rgba(246,245,242,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--ln)}
header img{width:30px;height:30px;border-radius:50%;background:#fff;padding:2px;box-shadow:var(--sh)}
header b{font-weight:600}
header small{margin-left:auto;color:var(--mu);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase}
main{padding:20px 16px 24px;max-width:720px;margin:0 auto}
.eb{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mu);margin:0 0 4px}
h1{font-size:28px;line-height:1.1;margin:0;font-weight:700;letter-spacing:-.02em}
h2{font-size:15px;margin:0 0 12px;font-weight:600}
h3{font-size:15px;margin:0 0 6px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:16px}
.acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:#fff;border-top:1px solid var(--ln);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{all:unset;flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;font-size:10.5px;color:var(--mu);cursor:pointer}
nav button i{display:grid;place-items:center;width:46px;height:26px;border-radius:13px}
nav button.on{color:var(--nv);font-weight:600}
nav button.on i{background:var(--soft)}
.card{background:#fff;border-radius:20px;padding:16px;box-shadow:var(--sh);margin-bottom:12px}
.hero{background:linear-gradient(115deg,#0b2a6b 35%,#16224a 70%,#2d3034);color:#fff;border-radius:22px;padding:18px;margin-bottom:12px}
.hero .eb{color:#aab8e6}
.hero strong{display:block;font-size:34px;font-weight:700;letter-spacing:-.02em;margin:2px 0 4px}
.hero strong small{font-size:12px;font-weight:500;color:#aab8e6;margin-left:5px}
.hero p{margin:0;color:#c3cdf0;font-size:12.5px}
.chips{display:flex;gap:8px;margin-top:12px}
.chips span{background:rgba(255,255,255,.12);padding:4px 10px;border-radius:99px;font-size:11.5px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.kpi{background:#fff;border-radius:18px;padding:14px;box-shadow:var(--sh);min-width:0}
.kpi .eb{font-size:9.5px;margin:0 0 6px}
.kpi strong{display:block;font-size:17px;font-weight:700;word-break:break-word}
.kpi small{display:block;color:var(--mu);font-size:11px;margin-top:2px;line-height:1.3}
.g3 .kpi{padding:12px}.g3 .kpi strong{font-size:13px}
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:6px;background:var(--nv);color:#fff;font-weight:600;font-size:13px;padding:11px 18px;border-radius:99px;box-shadow:0 6px 14px rgba(13,42,110,.25);white-space:nowrap}
.btn.g{background:#fff;color:var(--mu);box-shadow:var(--sh)}
.btn.d{background:transparent;color:var(--er);box-shadow:none}
.btn.s{padding:9px 14px;font-size:12px}
:focus-visible{outline:3px solid var(--in);outline-offset:2px}
.tabs{display:inline-flex;background:#fff;border-radius:99px;padding:4px;margin-bottom:14px;box-shadow:var(--sh)}
.tabs button{all:unset;cursor:pointer;padding:8px 14px;border-radius:99px;font-size:13px;color:var(--mu);font-weight:500}
.tabs button.on{background:var(--nv);color:#fff}
.tabs em{font-style:normal;opacity:.6;margin-left:4px;font-size:11px}
label{display:block;font-size:12px;color:var(--mu);margin-bottom:6px;font-weight:500}
input:not([type=checkbox]),.pick{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--ln);background:#faf9f7;color:var(--tx);font:inherit;font-size:15px}
.pick{display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer;text-align:left}
.sw{appearance:none;-webkit-appearance:none;flex:none;width:42px;height:24px;border-radius:99px;background:#dcd9d0;position:relative;cursor:pointer;margin:0}
.sw:checked{background:var(--nv)}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.sw:checked::after{left:21px}
.sw-row{display:flex;justify-content:space-between;align-items:center;gap:14px}
.f{display:grid;grid-template-columns:1fr 1fr;gap:14px}.f .w{grid-column:1/-1}
.pv{background:#fff;border-radius:16px;padding:12px 14px;display:grid;gap:4px;font-size:13px}
.pv div{display:flex;justify-content:space-between;gap:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px;background:#fff;border-radius:16px;margin-bottom:10px;box-shadow:var(--sh);cursor:pointer}
.row .l b{font-size:14.5px}.row .l div{color:var(--mu);font-size:12px}
.row .r{text-align:right}.row .r b{display:block;font-size:14px}
.card .row{box-shadow:none;background:#faf9f7;cursor:default}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:11px;font-weight:600;background:var(--soft);color:var(--mu)}
.chip.ok,.chip.Baixo{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.chip.dia,.chip.hoje,.chip.Médio{background:color-mix(in srgb,var(--wa) 14%,transparent);color:var(--wa)}
.chip.atr,.chip.Alto{background:color-mix(in srgb,var(--er) 14%,transparent);color:var(--er)}
.chip.ant{background:color-mix(in srgb,var(--in) 14%,transparent);color:var(--in)}
.empty{border:1px dashed var(--ln);background:#fbfaf8;border-radius:20px;padding:26px 16px;text-align:center;color:var(--mu);font-size:12.5px}
.empty i{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--soft);color:var(--nv);margin:0 auto 10px}
.empty b{display:block;color:var(--tx);font-size:14px;margin-bottom:4px}
.sp{display:flex;justify-content:space-between;align-items:baseline}
.sp a{font-size:12px;color:var(--nv);font-weight:600;cursor:pointer}
.bar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--soft);margin:12px 0 10px}
.lg{display:flex;gap:14px;flex-wrap:wrap;color:var(--mu);font-size:12px}
.lg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;margin:14px 0;font-size:13px;align-items:center}.kv span{color:var(--mu)}.kv b{text-align:right}
.note{color:var(--mu);font-size:12px;margin:10px 0 0}
.photo img{max-width:100%;border-radius:12px;margin-top:8px;display:block}
.photo p{margin:10px 0 0;color:var(--mu);font-size:12px}
.photo .empty{padding:12px;margin-top:8px}
dialog{border:0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));width:100%;max-width:560px;max-height:92%;margin:auto auto 0;border-radius:24px 24px 0 0;background:var(--bg);color:var(--tx);overflow:auto;animation:up .22s ease}
dialog::backdrop{background:rgba(10,18,40,.5)}
dialog h2{font-size:18px;margin:0 0 14px;font-weight:700}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.opt{display:flex;justify-content:space-between;align-items:center;padding:14px;border-radius:14px;background:#fff;margin-bottom:8px;cursor:pointer}
.opt.on{background:var(--soft);color:var(--nv);font-weight:600}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.nat .calbtn{display:none!important}
.src{padding:12px;background:#faf9f7;box-shadow:none;margin:10px 0}

/* licença */
.lic{padding:8px 16px 0;max-width:720px;margin:0 auto;font-size:13px;color:var(--mu)}.lic:empty{display:none}.lic.w{color:var(--wa);font-weight:600}.lic.r{color:var(--er);font-weight:700}
#lock{position:fixed;inset:0;z-index:120;background:#0a1128 radial-gradient(ellipse 70% 18% at 50% 100%,#f5b80055,transparent 72%);display:grid;place-items:center;padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px));overflow:auto;color:#fff}#lock[hidden]{display:none}#lock.wait>*{visibility:hidden}
.lk{text-align:center;max-width:420px;width:100%}.lkt{width:72px;height:72px;margin-bottom:22px;filter:drop-shadow(0 0 18px #f5b80066)}
.lk h1{font-size:24px;margin:0 0 8px;font-weight:700;color:#fff}.lks{margin:0 0 26px;font-size:15px;color:#a9b1cc}
.lk input{display:block;width:100%;background:#131c3d;color:#fff;text-align:center;border:1px solid #2a3768;border-radius:14px;margin:0 0 12px;font:inherit;font-size:16px;min-height:50px;padding:0 12px}.lk input:focus{outline:2px solid var(--go)}
.lkb{width:100%;border:0;border-radius:14px;background:var(--go);color:#111b3a;font:inherit;font-weight:700;padding:15px;cursor:pointer;min-height:48px}
#lke{color:#ff8d8d;min-height:22px;font-size:14px;margin:10px 0 0}.lki{color:#8a93b4;font-size:12.5px;margin:24px 0 8px}.lki b{color:#fff;letter-spacing:.08em}
.lkx{background:none;border:0;color:#a9b1cc;text-decoration:underline;font:inherit;font-size:13.5px;cursor:pointer;padding:10px;min-height:44px}
</style>
</head>

<script>
const K='txapita_v1',MULTA=2.5,PK={'Blitz':{d:7,t:25},'Boss':{d:14,t:35},'Big Boss':{d:28,t:50}};
let S={caixa:[],loans:[]},view='dash',tab='act',img={b:'',k:''};
try{S=JSON.parse(localStorage.getItem(K))||S}catch(e){}
S.inv??=[];S.cfg??={multas:false};
S.loans.forEach(l=>{if(!l.fontes)l.fontes=l.invId?[{inv:l.invId,valor:l.invValor,pct:l.pct}]:[]});
const PKS=['Blitz','Boss','Big Boss','Personalizado'],pctFor=(i,p)=>i.pcts&&i.pcts[p]!=null?i.pcts[p]:i.pct;
const LN=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.LocalNotifications;
const NAT=!!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform()&&LN);
if(NAT)document.documentElement.classList.add('nat');
async function agendar(ask){
 if(!NAT)return;
 try{
  let pm=await LN.checkPermissions();
  if(pm.display!=='granted'){if(!ask)return;pm=await LN.requestPermissions();if(pm.display!=='granted')return}
  const pend=await LN.getPending();
  if(pend.notifications.length)await LN.cancel({notifications:pend.notifications.map(n=>({id:n.id}))});
  const out=[],now=Date.now();
  S.loans.filter(l=>!l.pago).forEach(l=>{
   const c=calc(l),base=(parseInt(l.id,36)%2e7)*100;
   const add=(k,d,t,b)=>{const w=new Date(d+'T08:00:00');if(w.getTime()>now)out.push({id:base+k,title:t,body:b,schedule:{at:w,allowWhileIdle:true}})};
   add(0,addD(c.venc,-1),'Vence amanhã: '+l.cliente,'Total a receber: '+fmt(c.total));
   add(1,c.venc,'Vence hoje: '+l.cliente,'Total a receber: '+fmt(c.total));
   for(let k=1;k<=14;k++)add(1+k,addD(c.venc,k),'Em atraso: '+l.cliente+' ('+(k===1?'1 dia':k+' dias')+')','Multa acumulada '+fmt(c.total*MULTA/100*k)+' · Total '+fmt(c.total*(1+MULTA/100*k)));
  });
  if(out.length)await LN.schedule({notifications:out});
 }catch(e){console.error(e)}
}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S));if(NAT)setTimeout(()=>agendar(true),300);return true}catch(e){alert('Não foi possível guardar: a memória do navegador está cheia. Elimine empréstimos antigos ou use fotos mais pequenas.');return false}};
const $=s=>document.querySelector(s);
const fmt=n=>new Intl.NumberFormat('pt-PT',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n)+' MZN';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const ms=s=>Date.parse(s+'T00:00:00Z');
const addD=(s,n)=>new Date(ms(s)+n*864e5).toISOString().slice(0,10);
const diff=(a,b)=>Math.round((ms(b)-ms(a))/864e5);
const dmy=s=>s.split('-').reverse().join('/');

function calc(l,ref=today()){
 const total=l.valor*(1+l.taxa/100),venc=addD(l.inicio,l.prazo),dias=Math.max(0,diff(venc,ref)),multa=total*MULTA/100*dias;
 return{total,juros:total-l.valor,venc,dias,multa,devido:total+multa};
}
function status(l){
 const c=calc(l);
 if(l.pago){const d=diff(c.venc,l.pago.data);return d<0?{k:'ant',t:'Pago '+pl(-d)+' antes'}:d===0?{k:'dia',t:'Pago no dia'}:{k:'atr',t:'Pago com '+pl(d)+' de atraso'}}
 if(c.dias>0)return{k:'atr',t:'Em atraso há '+pl(c.dias)};
 const r=diff(today(),c.venc);return r===0?{k:'hoje',t:'Vence hoje'}:{k:'ok',t:'Vence em '+pl(r)};
}
const invOf=id=>S.inv.find(i=>i.id===id);
function split(l){
 const c=calc(l),tl=l.pago?l.pago.valor-l.valor:c.juros;
 const base=Math.max(0,l.pago&&!S.cfg.multas?Math.min(tl,c.juros):tl);
 const por=(l.fontes||[]).map(f=>({inv:f.inv,valor:f.valor,pct:f.pct,ela:base*Math.min(1,f.valor/l.valor)*(f.pct/100)}));
 const ela=por.reduce((a,x)=>a+x.ela,0);
 return{ela,eu:tl-ela,por};
}
function ledger(i){
 const mv=S.caixa.filter(m=>m.inv===i.id),sum=t=>mv.filter(m=>m.tipo===t).reduce((a,m)=>a+m.valor,0);
 const mine=(l,k)=>split(l).por.filter(p=>p.inv===i.id).reduce((a,p)=>a+p[k],0);
 const ls=S.loans.filter(l=>(l.fontes||[]).some(f=>f.inv===i.id)),ac=ls.filter(l=>!l.pago);
 const lr=ls.filter(l=>l.pago).reduce((a,l)=>a+mine(l,'ela'),0),circ=ac.reduce((a,l)=>a+mine(l,'valor'),0),esp=ac.reduce((a,l)=>a+mine(l,'ela'),0);
 const saldo=sum('entrada')+lr-sum('saida');
 return{lr,circ,esp,saldo,livre:saldo-circ};
}
function stats(){
 const caixa=S.caixa.reduce((a,m)=>a+(m.tipo==='entrada'?m.valor:-m.valor),0)-S.loans.reduce((a,l)=>a+l.valor,0)+S.loans.reduce((a,l)=>a+(l.pago?l.pago.valor:0),0);
 const act=S.loans.filter(l=>!l.pago),done=S.loans.filter(l=>l.pago);
 const circ=act.reduce((a,l)=>a+l.valor,0),rend=act.reduce((a,l)=>a+calc(l).juros,0),multas=act.reduce((a,l)=>a+calc(l).multa,0);
 const lucro=done.reduce((a,l)=>a+l.pago.valor-l.valor,0);
 const cnt={ant:0,dia:0,atr:0},cl={};
 S.loans.forEach(l=>{
  const s=status(l),key=l.cliente.trim().toLowerCase();
  const c=cl[key]??=({nome:l.cliente.trim(),ant:0,dia:0,atr:0,atrDias:0,maxAtual:0,ativo:0,n:0});
  c.n++;
  if(l.pago||s.k==='atr'){cnt[s.k]++;c[s.k]++;
   const d=l.pago?diff(calc(l).venc,l.pago.data):calc(l).dias;if(s.k==='atr')c.atrDias+=d}
  if(!l.pago){c.ativo+=l.valor;if(s.k==='atr')c.maxAtual=Math.max(c.maxAtual,calc(l).dias)}
 });
 Object.values(cl).forEach(c=>{
  const av=c.ant+c.dia+c.atr,rate=av?c.atr/av:0,avg=c.atr?c.atrDias/c.atr:0;
  c.risco=!av?'Sem histórico':(rate>=.5||c.maxAtual>=7)?'Alto':(rate>=.2||avg>=3)?'Médio':'Baixo';
 });
 const emAtraso=act.filter(l=>status(l).k==='atr').reduce((a,l)=>a+l.valor,0);
 const exposAlto=act.filter(l=>cl[l.cliente.trim().toLowerCase()].risco==='Alto').reduce((a,l)=>a+l.valor,0);
 return{caixa,act,done,circ,rend,multas,lucro,cnt,cl:Object.values(cl),emAtraso,exposAlto,ela:act.reduce((a,l)=>a+split(l).ela,0),elaRec:done.reduce((a,l)=>a+split(l).ela,0)};
}

function openView(id){
 const l=S.loans.find(x=>x.id===id),c=calc(l),s=status(l),sp=split(l);
 $('#dView').innerHTML=`<h2>${esc(l.cliente)}</h2><span class="chip ${s.k}">${s.t}</span>
 <div class="kv"><span>Telefone</span><b>${esc(l.tel)||'–'}</b><span>Data do empréstimo</span><b>${dmy(l.inicio)}</b><span>Valor emprestado</span><b>${fmt(l.valor)}</b><span>Pacote e taxa</span><b>${esc(l.pacote)} · ${l.taxa}%</b><span>Prazo</span><b>${pl(l.prazo)}</b><span>Juros</span><b>${fmt(c.juros)}</b>${(l.fontes||[]).length?`<span>Capital próprio</span><b>${fmt(l.valor-l.fontes.reduce((a,f)=>a+f.valor,0))}</b>${sp.por.map(x=>`<span>Capital de ${esc(invOf(x.inv)?invOf(x.inv).nome:'?')} (${x.pct}%)</span><b>${fmt(x.valor)}</b><span>Parte dela nos juros</span><b>${fmt(x.ela)}</b>`).join('')}<span>A tua parte</span><b>${fmt(sp.eu)}</b>`:''}<span>Total com juros</span><b>${fmt(c.total)}</b><span>Vencimento</span><b>${dmy(c.venc)}</b>
 ${l.pago?`<span>Pago em ${dmy(l.pago.data)}</span><b>${fmt(l.pago.valor)}</b>`:`<span>Multa até hoje (${pl(c.dias)})</span><b>${fmt(c.multa)}</b><span>Total em dívida hoje</span><b>${fmt(c.devido)}</b>`}</div>
 ${l.pago?'':`<form id="fPay" class="f" style="margin-bottom:24px"><div><label for="pD">Data do pagamento</label><input id="pD" type="date" min="${l.inicio}" value="${today()}" required></div><div><label for="pV">Valor recebido (MZN)</label><input id="pV" type="number" step="any" min="0.01" value="${c.devido.toFixed(2)}" required></div><div class="w"><button class="btn" style="display:block">Confirmar pagamento</button></div></form>`}
 <h3>Documentos</h3><div class="photo">${l.idFoto?`<p>Documento de identidade</p><img src="${l.idFoto}" alt="Documento de identidade">`:'<p class="empty">Sem foto do documento.</p>'}${l.carta?`<p>Carta de compromisso</p><img src="${l.carta}" alt="Carta de compromisso">`:'<p class="empty">Sem foto da carta de compromisso.</p>'}</div>
 <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between;margin-top:28px"><button class="btn d" onclick="delLoan('${l.id}')">Eliminar</button>${l.pago?'':`<button class="btn g calbtn" onclick="addCal('${l.id}')">Adicionar ao calendário</button>`}<button class="btn g" onclick="dView.close()">Fechar</button></div>`;
 dView.showModal();
 if(!l.pago){$('#pD').oninput=e=>{if(e.target.value)$('#pV').value=calc(l,e.target.value).devido.toFixed(2)};
  $('#fPay').onsubmit=e=>{e.preventDefault();l.pago={data:$('#pD').value,valor:+$('#pV').value};if(save()){dView.close();render()}}}
}
function delLoan(id){if(confirm('Eliminar este empréstimo e os seus documentos? Esta ação não pode ser desfeita.')){S.loans=S.loans.filter(l=>l.id!==id);save();dView.close();render()}}

$('#nav').innerHTML=[['dash','Resumo','grid'],['loans','Empréstimos','loan'],['cash','Caixa','wallet'],['inv','Investidoras','users']].map(([v,t,k])=>`<button data-v="${v}"><i>${ico(k)}</i>${t}</button>`).join('');
$('#nav').onclick=e=>{const b=e.target.closest('button');if(b){view=b.dataset.v;render();scrollTo(0,0)}};
$('#dt').textContent=new Date().toLocaleDateString('pt-PT',{day:'numeric',month:'long',year:'numeric'});
document.addEventListener('click',e=>{
 const g=e.target.closest('#fCash .tabs button');
 if(g){g.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===g));$('#cT').value=g.dataset.v}
 if(e.target.tagName==='DIALOG'){const r=e.target.getBoundingClientRect();if(e.clientY<r.top||e.clientY>r.bottom||e.clientX<r.left||e.clientX>r.right)e.target.close()}
});
$('#nP').onchange=setPk;
['nV','nX','nD','nI'].forEach(i=>$('#'+i).oninput=pv);
$('#nFl').addEventListener('input',pv);
$('#nFl').addEventListener('change',e=>{if(e.target.classList.contains('sI'))setPct(e.target.closest('.src'));pv()});
$('#nB').onchange=e=>readImg(e.target.files[0],d=>{img.b=d;$('#nBp').innerHTML=d?`<img src="${d}" alt="Pré-visualização do documento">`:''});
$('#nK').onchange=e=>readImg(e.target.files[0],d=>{img.k=d;$('#nKp').innerHTML=d?`<img src="${d}" alt="Pré-visualização da carta">`:''});
$('#nX').addEventListener('input',()=>{const p=PK[$('#nP').value];if(p&&+$('#nX').value!==p.t)$('#nP').value=$('#nP').value});
$('#fNew').onsubmit=e=>{
 e.preventDefault();
 const fs=srcs().filter(f=>f.valor>0),vv=+$('#nV').value;
 if(fs.reduce((a,f)=>a+f.valor,0)>vv+0.005){alert('Os capitais das investidoras somam mais do que o valor do empréstimo.');return}
 S.loans.push({fontes:fs,id:Date.now().toString(36),cliente:$('#nC').value.trim(),tel:$('#nT').value.trim(),valor:+$('#nV').value,pacote:$('#nP').value,taxa:+$('#nX').value,prazo:Math.round(+$('#nD').value),inicio:$('#nI').value,idFoto:img.b,carta:img.k,pago:null});
 if(save()){dNew.close();tab='act';view='loans';render();openView(S.loans[S.loans.length-1].id)}else S.loans.pop();
};
document.addEventListener('submit',e=>{
 if(e.target.id==='fCash'){e.preventDefault();S.caixa.push({data:today(),tipo:$('#cT').value,valor:+$('#cV').value,nota:$('#cN').value.trim(),inv:$('#cO').value||null});save();render()}
 if(e.target.id==='fInv'){e.preventDefault();const pcts={};PKS.forEach((p,k)=>pcts[p]=+$('#ip'+k).value);S.inv.push({id:Date.now().toString(36),nome:$('#iN').value.trim(),pct:pcts.Personalizado,pcts});save();dInv.close();render()}
});
document.addEventListener('change',e=>{
 if(e.target.id==='iM'){S.cfg.multas=e.target.checked;save();render()}
 if(e.target.classList.contains('ie')){const i=invOf(e.target.dataset.i);i.pcts={...(i.pcts||{}),[e.target.dataset.p]:+e.target.value};save();render()}
});
render();
/* ---- licença: a app nasce BLOQUEADA; só um código assinado pelo desenvolvedor a abre ---- */
const PUB={"kty":"EC","crv":"P-256","x":"oDcyZVlp1-toIaL-d7ydHAkG_KCL9RutGVYwq8pQmEI","y":"zCdTz7jfuKQ3JVGAviCMl2kaGwO5wGOxsTs9yGop9xY"},LK='txapita-licenca-v1',IK='txapita-instalacao-v1',MK='txapita-visto-v1';
const lsg=k=>{try{return localStorage.getItem(k)}catch(e){return null}},lss=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const agoraMs=()=>Math.max(Date.now(),+lsg(MK)||0); // o relógio nunca "anda para trás"
let instId=lsg(IK);if(!instId){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';try{instId=[...crypto.getRandomValues(new Uint8Array(8))].map(x=>A[x%32]).join('').replace(/(.{4})/,'$1-')}catch(e){instId='SEM-ID'}lss(IK,instId)}
let fimLic=null,bloq=true;
const b64d=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
const verificaCodigo=async(cod,rev)=>{
 if(!(window.crypto&&crypto.subtle))throw new Error('Este navegador não consegue validar o código. Use o Chrome ou o Safari.');
 const p=cod.split('.');if(p.length!==3||p[0]!=='TX1')throw new Error('Código inválido.');
 let ok=false;try{const k=await crypto.subtle.importKey('jwk',PUB,{name:'ECDSA',namedCurve:'P-256'},false,['verify']);ok=await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},k,b64d(p[2]),new TextEncoder().encode(p[1]))}catch(e){}
 if(!ok)throw new Error('Código inválido.');
 const d=JSON.parse(new TextDecoder().decode(b64d(p[1])));
 if(d.i&&d.i!==instId)throw new Error('Este código pertence a outra instalação.');
 if(!rev&&!(d.a>agoraMs()))throw new Error('Este código já expirou.');
 return d};
const fmtR=ms=>{const m=Math.max(0,Math.floor(ms/60000)),d=Math.floor(m/1440),h=Math.floor(m%1440/60),n=m%60;return d?d+(d===1?' dia ':' dias ')+h+' h':h?h+' h '+n+' min':n+' min'};
function tick(){
 lss(MK,String(agoraMs()));
 const r=(fimLic||0)-agoraMs(),L=document.getElementById('lic'),LKel=document.getElementById('lock');
 bloq=!(r>0);LKel.classList.remove('wait');LKel.hidden=!bloq;
 ['header','main','nav'].forEach(s=>{const e=document.querySelector(s);if(e)e.inert=bloq});
 if(bloq){document.querySelectorAll('dialog[open]').forEach(d=>d.close());document.getElementById('lkid').textContent=instId;L.textContent='';if(!LKel.dataset.f){LKel.dataset.f=1;setTimeout(()=>document.getElementById('lkc').focus(),60)}return}
 L.className='lic'+(r<=6*36e5?' r':r<=2*864e5?' w':'');
 L.textContent=r<=7*864e5?'Licença válida até '+new Date(fimLic).toLocaleString('pt-PT',{dateStyle:'short',timeStyle:'short'})+' · faltam '+fmtR(r):'';
}
async function desbloquear(){const e=document.getElementById('lke'),i=document.getElementById('lkc');e.textContent='';
 try{const cod=i.value.replace(/\s+/g,'');if(!cod)throw new Error('Introduza o código de licença.');const d=await verificaCodigo(cod);lss(LK,cod);fimLic=d.a;i.value='';tick();render()}catch(x){e.textContent=x.message||'Código inválido.'}}
function copiaId(){try{navigator.clipboard.writeText(instId);document.getElementById('lke').textContent='ID copiado.'}catch(e){}}
function exportaBloq(){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='txapita-copia-'+today()+'.json';document.body.append(a);a.click();a.remove()}catch(e){}}
(async()=>{const c=lsg(LK);if(c){try{fimLic=(await verificaCodigo(c,true)).a}catch(e){}}tick();setInterval(tick,15000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()})})();
agendar(true);
if(NAT&&Capacitor.Plugins.App)Capacitor.Plugins.App.addListener('backButton',()=>{const d=[...document.querySelectorAll('dialog[open]')].pop();if(d)d.close();else if(view!=='dash'){view='dash';render();scrollTo(0,0)}else Capacitor.Plugins.App.exitApp()});
</script>
<script>if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script>
